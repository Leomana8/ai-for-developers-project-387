name: opencode-review

# Авторевью PR агентом. Запускается только по `workflow_dispatch` — из
# `opencode-trigger.yml`, который перехватывает `pull_request` (в том числе от
# ботов). Прямой триггер `pull_request` снять пришлось: для событий от бота
# экшен падает на `assertPermissions` — у `opencode-agent[bot]` и
# `github-actions[bot]` уровень прав `none`, а проверку нельзя отключить входом.
#
# Две вещи на `workflow_dispatch` экшен не делает сам (`github.handler.ts`,
# ветка `isRepoEvent`): не передаёт диф PR и не публикует комментарий —
# `issueId` там undefined, `createComment` не вызывается, текст ревью уходит
# только в лог прогона. Поэтому промпт обязывает агента получить PR через `gh`
# и опубликовать ревью комментарием самому.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер Pull Request для ревью'
        required: true
      pr_head_sha:
        description: 'SHA коммита, который проверяем'
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Страховка от зависания — как в `opencode.yml`: экшен поднимает `opencode serve`
    # без клиента, который снял бы запрос на подтверждение (ask).
    timeout-minutes: 15
    permissions:
      id-token: write
      # GITHUB_TOKEN раннера нужен экшену для записи в тред PR: `use_github_token: true`
      # ниже передаёт агенту именно его, OIDC-обмен токеном приложения не нужен.
      # read-прав из задачи не хватило: агент публикует ревью комментарием и реакции
      # ставит через issues API.
      # Сам репозиторий агент только читает — на правку кода прав не выдаём:
      # `contents: read` — единственная преграда между агентом и коммитом, потому
      # что на `workflow_dispatch` проверка прав экшена пропущена.
      contents: read
      # write, а не read: комментарий в PR по REST-эндпоинтам issues требует
      # и `issues: write`, и `pull-requests: write`.
      pull-requests: write
      issues: write
    steps:
      # Чекаутим не ветку, а конкретный SHA из PR: `workflow_dispatch` не несёт
      # контекста PR, поэтому head SHA приходится передавать через вход.
      # `persist-credentials: false` убирает extraheader с токеном из конфига git —
      # агент получает доступ через env `GITHUB_TOKEN`.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.pr_head_sha }}
          persist-credentials: false

      - name: Review pull request
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          # Токен раннера: экшену он нужен, только когда включён `use_github_token`,
          # агенту — для `gh pr diff` и `gh pr comment`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          # true — ревью публикует GITHUB_TOKEN раннера, а не токен приложения
          # OpenCode из OIDC-обмена: токен приложения дал бы агенту права на запись
          # в код, а этот прогон — только ревью.
          use_github_token: true
          # Свой промпт вместо встроенного дефолта: правила проекта живут в
          # AGENTS.md и в договорах OpenAPI, а на `workflow_dispatch` экшен не
          # передаёт ни диф PR, ни его номер — их приходится называть явно.
          prompt: |
            Проведи ревью Pull Request №${{ inputs.pr_number }} по правилам репозитория.

            Прогон запущен по `workflow_dispatch`: экшен не передал тебе ни диф, ни
            номер PR, и комментарий публиковать не будет — обе вещи делаешь ты через `gh`.

            Как получить контекст:
            - `gh pr view <N> --json title,body,author,baseRefName,headRefName` — что за PR;
            - `gh pr diff <N>` — диф;
            - `gh api repos/{owner}/{repo}/pulls/<N>/comments` — замечания на строках, если нужны.

            Что проверять:
            - Только TypeScript, без нетипизированного JS; форматирование — Prettier
              (ESLint/oxlint не настраивается), проверка — `npm run lint`.
            - Контракт API: правка эндпоинтов означает правку `spec/*.tsp` и регенерацию
              через `npm run spec:generate`. CI падает на расхождении спеки
              (`spec:check`, `spec:client:check`, `spec:server:check`).
            - Тесты: Vitest; новый эндпоинт сервера начинается с дымового теста
              в стиле `apps/server/src/app.test.ts`.
            - Фронтенд ходит в данные только типизированным клиентом
              `apps/web/src/lib/api.ts`, относительными путями `/api/*`.
            - Термины — как в `GLOSSARY.md`, решения — как в `docs/adr/`.
            - Коммиты — Conventional Commits со ссылкой на тикет;
              `.github/workflows/hexlet-check.yml` не трогаем.

            Как отвечать:
            - Опубликуй ревью комментарием в PR: `gh pr comment <N> --body-file -`,
              текст через heredoc. Файлов в репозитории не создавай и ничего не
              коммить: любое изменение дерева экшен закоммитит, запушит ветку
              `opencode/dispatch-…` и откроет лишний PR.
            - Конкретные замечания — по месту: строка + файл, что не так и почему.
            - Сводка в конце: что блокирует мердж, что необязательно.
            - Без похвал и придирок к тому, что уже решает Prettier. Если PR в порядке —
              одна строка.
