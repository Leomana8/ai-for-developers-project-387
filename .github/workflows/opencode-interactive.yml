name: opencode-interactive

# Обсуждение по комментариям в PR. Отличие от `opencode.yml` — своя команда и режим
# разговора: там по `/oc` агент вносит правки и коммитит, здесь по `/ask` он отвечает
# в треде и код не трогает. Команды `/oc` и `/opencode` намеренно не переиспользуются,
# иначе на один комментарий сработали бы оба экшена.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  ask:
    # Только комментарии в PR (у issue нет поля `pull_request`) и только с командой.
    # Проверка дублирует `mentions` у экшена намеренно: `if` отсекает лишние комментарии
    # ещё до подъёма раннера, а `mentions` вырезает команду из текста запроса.
    if: |
      github.event.comment.user.type != 'Bot' &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'opencode-agent[bot]' &&
      github.actor != 'github-actions[bot]' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
        github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, ' /ask') ||
        startsWith(github.event.comment.body, '/ask') ||
        contains(github.event.comment.body, ' /interactive') ||
        startsWith(github.event.comment.body, '/interactive'))
    runs-on: ubuntu-latest
    # Страховка от зависания — как в `opencode.yml`: экшен поднимает `opencode serve`
    # без клиента, который снял бы запрос на подтверждение (ask).
    timeout-minutes: 15
    permissions:
      id-token: write
      # Экшен комментирует через токен приложения OpenCode, полученный OIDC-обменом.
      # GITHUB_TOKEN в него не передаётся, поэтому write-права воркфлоу не нужны.
      contents: read
    steps:
      # Репо нужно агенту для чтения: ответ должен опираться на файлы, а не на память.
      # `persist-credentials: false` — как в `opencode.yml`, лишний токен в git не нужен.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/mimo-v2.6-flash-free
          mentions: /ask,/interactive
          # Репозиторий публичный: не публикуем сессию OpenCode по ссылке.
          share: false
          prompt: |
            Ответь на вопрос из комментария в PR.

            Правила:
            - Это разговор, а не задача: отвечаешь в треде, код не меняешь — ни правок,
              ни коммитов, ни push.
            - Язык ответа — язык вопроса.
            - Перед ответом прочитай `AGENTS.md`, а по теме — сами файлы, и ссылайся
              на них как `путь:строка`. Если вопрос про комментарий на конкретной строке,
              в контексте уже есть файл, номера строк и диф.
            - Если нужен выбор, а не факт, перечисли варианты со своей рекомендацией,
              а не выбирай молча.
            - Не выдумывай: непроверенное — так и помечай.
