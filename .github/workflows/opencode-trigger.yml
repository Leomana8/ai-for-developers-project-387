name: opencode-trigger

# Диспетчер авторевью. Событие `pull_request`, инициированное ботом (он открыл PR
# или запушил в свою ветку), падает в экшене на `assertPermissions`: тот требует
# write-доступ у `github.context.actor`, а у `opencode-agent[bot]` уровень `none`
# (прогоны 39388313755, 39384424450 — «User opencode-agent[bot] does not have
# write permissions»). У `github-actions[bot]` уровень тоже `none`, поэтому
# «смывать» актора перезапуском через комментарий бесполезно: проверка снова
# увидит бота. Снять проверку нельзя — входа для этого в экшене нет. Зато экшен
# пропускает её для REPO_EVENTS (`schedule`, `workflow_dispatch` —
# `github.handler.ts:149-151, 491-494`), поэтому ревью перезапускается здесь:
# `gh workflow run` меняет событие на `workflow_dispatch` и уводит прогон
# из-под проверки прав.
#
# Партнёр `opencode-review.yml`: там работа агента, здесь — только перезапуск.
# Фильтр по автору PR (в отличие от прежнего `user.type != 'Bot'`) не ставим —
# ревью бот-PR и есть цель этого воркфлоу.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  # `gh workflow run` — запись в Actions.
  actions: write

jobs:
  dispatch:
    # Черновики не ревьюим. Форки пропускаем: GITHUB_TOKEN в них read-only,
    # `gh workflow run` упадёт на правах, а секреты в форки всё равно не приходят.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Trigger review workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Репозиторий — явно: в job нет checkout, а `gh workflow run` без
          # `--repo` ищет его по локальному git (`fatal: not a git repository`).
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Запускаем основной воркфлоу ревью, передавая номер PR
          gh workflow run opencode-review.yml \
            -f pr_number="${{ github.event.pull_request.number }}" \
            -f pr_head_sha="${{ github.event.pull_request.head.sha }}"
